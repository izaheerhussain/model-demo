name: End-to-End MLOps Pipeline

on:
  push:
    branches:
      - main
    # UPDATED: Watch the root folder for changes
    paths:
      - '*.py'
      - '*.yml'
      - 'requirements.txt'

env:
  RESOURCE_GROUP: "zaheer-h-rg"
  WORKSPACE: "your-ml-workspace-name"

jobs:
  train-model:
    name: Train and Register Model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - run: az extension add -n ml -y
      - name: Run Training Pipeline
        run: |
          az ml job create --file pipeline.yml --resource-group ${{ env.RESOURCE_GROUP }} --workspace-name ${{ env.WORKSPACE }} --stream

  deploy-model:
    name: Deploy to Live API Endpoint
    needs: train-model 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - run: az extension add -n ml -y
      - name: Create Endpoint
        run: |
          az ml online-endpoint create --file endpoint.yml --resource-group ${{ env.RESOURCE_GROUP }} --workspace-name ${{ env.WORKSPACE }}
      - name: Create Deployment
        run: |
          az ml online-deployment create --file deployment.yml --resource-group ${{ env.RESOURCE_GROUP }} --workspace-name ${{ env.WORKSPACE }} --all-traffic